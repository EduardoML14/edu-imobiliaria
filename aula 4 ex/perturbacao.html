<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perturbação do Sossego</title>
<link rel="stylesheet" href="assets/estilo/style.css">
</head>
<body>
<div class="container">

  <h1>Perturbação do Sossego</h1>

  <div id="etapa-1" class="tela ativa">
    <h2>Etapa 1 de 3</h2>
    <label>Origem do barulho</label>
    <select id="origem">
      <option value="">Selecione...</option>
      <option>Som automotivo</option>
      <option>Obra ou construção</option>
      <option>Festa ou evento</option>
      <option>Estabelecimento comercial</option>
      <option>Outro</option>
    </select>

    <label>Horário em que costuma ocorrer</label>
    <input type="time" id="horario">

    <div class="botoes">
      <a class="btn-secundario" href="index.html">Cancelar</a>
      <button class="btn-primario" onclick="mostrarTela('etapa-2')">Próxima etapa</button>
    </div>
  </div>

  <div id="etapa-2" class="tela">
    <h2>Etapa 2 de 3</h2>
    <label>Endereço afetado</label>
    <input type="text" id="endereco">

    <label>Frequência</label>
    <select id="frequencia">
      <option value="">Selecione...</option>
      <option>Primeira vez</option>
      <option>Acontece às vezes</option>
      <option>Acontece quase todos os dias</option>
    </select>

    <div class="botoes">
      <button class="btn-secundario" onclick="mostrarTela('etapa-1')">Voltar</button>
      <button class="btn-primario" onclick="mostrarTela('etapa-3')">Próxima etapa</button>
    </div>
  </div>

  <div id="etapa-3" class="tela">
    <h2>Etapa 3 de 3</h2>
    <label>Descreva a situação</label>
    <textarea id="descricao"></textarea>

    <div class="checkbox-linha">
      <label><input type="checkbox" id="conversou"> Já tentei conversar com o responsável</label>
    </div>

    <div class="botoes">
      <button class="btn-secundario" onclick="mostrarTela('etapa-2')">Voltar</button>
      <button class="btn-primario" onclick="mostrarResumo()">Revisar denúncia</button>
    </div>
  </div>

  <div id="tela-resumo" class="tela">
    <h2>Confirme os dados da denúncia</h2>
    <div id="resumo-conteudo"></div>

    <div class="botoes">
      <button class="btn-secundario" onclick="mostrarTela('etapa-3')">Voltar</button>
      <button class="btn-primario" onclick="enviarDenuncia()">Enviar denúncia</button>
    </div>
  </div>

  <div id="tela-sucesso" class="tela">
    <div class="sucesso">
      <h2>Denúncia registrada com sucesso!</h2>
      <div class="protocolo" id="numero-protocolo"></div>
      <a class="btn-primario" href="index.html">Voltar ao início</a>
    </div>
  </div>

</div>

<script src="assets/scripts/common.js"></script>
<script src="assets/scripts/perturbacao.js"></script>

</body>
</html>
