<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do corretor | Edu Imobiliária</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body data-pagina="admin">
    <header>
        <div id="navbar-pagina"></div>
    </header>

    <main class="container py-4">

        <!-- Tela de login -->
        <section id="tela-login" class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <form id="form-login" class="info-box mt-4">
                    <h1 class="h4 mb-1"><i class="bi bi-lock"></i> Área do corretor</h1>
                    <p class="text-secondary small">Acesso restrito para cadastrar e editar os imóveis do site.</p>
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control mb-3" autocomplete="current-password" required>
                    <button type="submit" class="btn btn-primario w-100">Entrar</button>
                    <div id="login-retorno" class="mt-3" role="status"></div>
                </form>
            </div>
        </section>

        <!-- Painel (aparece depois do login) -->
        <section id="painel" class="d-none">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h1 class="h3 mb-0">Painel do corretor</h1>
                <button id="sair" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="text-secondary mb-0" id="total-imoveis"></p>
                <button class="btn btn-edu" id="novo-imovel"><i class="bi bi-plus-lg"></i> Novo imóvel</button>
            </div>
            <div class="table-responsive info-box p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Foto</th>
                            <th scope="col">Imóvel</th>
                            <th scope="col" class="d-none d-md-table-cell">Finalidade</th>
                            <th scope="col">Preço</th>
                            <th scope="col" class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-imoveis"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de cadastro / edição de imóvel -->
    <div class="modal fade" id="modal-imovel" tabindex="-1" aria-labelledby="titulo-modal" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <form class="modal-content" id="form-imovel" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5" id="titulo-modal">Novo imóvel</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="titulo" class="form-label">Título *</label>
                            <input type="text" id="titulo" class="form-control" maxlength="150" required>
                        </div>
                        <div class="col-md-4">
                            <label for="tipo" class="form-label">Tipo *</label>
                            <select id="tipo" class="form-select" required>
                                <option>Apartamento</option>
                                <option>Casa</option>
                                <option>Cobertura</option>
                                <option>Terreno</option>
                                <option>Sala comercial</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="finalidade" class="form-label">Finalidade *</label>
                            <select id="finalidade" class="form-select" required>
                                <option>Venda</option>
                                <option>Aluguel</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="preco" class="form-label">Preço (R$) *</label>
                            <input type="number" id="preco" class="form-control" min="1" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label for="cidade" class="form-label">Cidade *</label>
                            <input type="text" id="cidade" class="form-control" value="Balneário Camboriú" required>
                        </div>
                        <div class="col-md-6">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" id="bairro" class="form-control">
                        </div>
                        <div class="col-6 col-md">
                            <label for="area" class="form-label">Área (m²)</label>
                            <input type="number" id="area" class="form-control" min="0">
                        </div>
                        <div class="col-6 col-md">
                            <label for="quartos" class="form-label">Quartos</label>
                            <input type="number" id="quartos" class="form-control" min="0">
                        </div>
                        <div class="col-4 col-md">
                            <label for="suites" class="form-label">Suítes</label>
                            <input type="number" id="suites" class="form-control" min="0">
                        </div>
                        <div class="col-4 col-md">
                            <label for="banheiros" class="form-label">Banheiros</label>
                            <input type="number" id="banheiros" class="form-control" min="0">
                        </div>
                        <div class="col-4 col-md">
                            <label for="vagas" class="form-label">Vagas</label>
                            <input type="number" id="vagas" class="form-control" min="0">
                        </div>
                        <div class="col-12">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea id="descricao" class="form-control" rows="4"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="destaque">
                                <label class="form-check-label" for="destaque">Mostrar em destaque na página inicial</label>
                            </div>
                        </div>
                        <div class="col-12" id="bloco-imagens-atuais">
                            <label class="form-label">Fotos atuais <small class="text-secondary">(marque para remover)</small></label>
                            <div id="imagens-atuais" class="d-flex flex-wrap gap-2"></div>
                        </div>
                        <div class="col-12">
                            <label for="imagens" class="form-label">Adicionar fotos <small class="text-secondary">(até 10, máx. 5 MB cada)</small></label>
                            <input type="file" id="imagens" class="form-control" accept="image/*" multiple>
                        </div>
                    </div>
                    <div id="imovel-retorno" class="mt-3" role="status"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primario" id="salvar-imovel">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-pagina"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/loadings.js" type="module"></script>
    <script src="assets/js/admin.js" type="module"></script>
</body>
</html>
